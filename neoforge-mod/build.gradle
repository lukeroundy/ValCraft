plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            // Hide the window as soon as MC owns it (also set this in the Prism instance's JVM arguments)
            systemProperty 'valcraft.startHidden', System.getenv('VC_STARTHIDDEN') ?: 'true'
            systemProperty 'valcraft.selftest', System.getenv('VC_SELFTEST') ?: 'false'
            systemProperty 'valcraft.debugMove', System.getenv('VC_DEBUGMOVE') ?: 'false'
            if (project.hasProperty('quickPlay')) programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
